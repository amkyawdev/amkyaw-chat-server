<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>amkyaw@chat:~$</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Terminal client served to LAN peers. Same tokens as the native UI. */
  :root{
    --bg-void:#0a0e14; --bg-surface:#0d1117; --bg-surface-alt:#141a22;
    --bg-bar:#111820; --bg-btn-green:#0a2e0a;
    --neon-green:#00ff41; --cyan:#00d9ff; --red-alert:#ff0040;
    --text-white:#c9d1d9; --text-secondary:#5a7d5a; --text-dim:#2d4a2d;
    --glow-green-60:#00ff4199; --glow-green-40:#00ff4166; --glow-green-25:#00ff4140;
    --glow-cyan-40:#00d9ff66;
    --mono:"JetBrains Mono","Fira Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg-void);color:var(--text-secondary);font-family:var(--mono);
    font-size:13px;display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  }
  header{
    flex:0 0 48px;display:flex;align-items:center;gap:8px;padding:0 10px;
    background:var(--bg-bar);border-bottom:1px solid var(--glow-green-40);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--neon-green);
    box-shadow:0 0 8px 2px var(--glow-green-60)}
  .dot.off{background:var(--red-alert);box-shadow:0 0 8px 2px rgba(255,0,64,.5)}
  header .title{flex:1;color:var(--neon-green);text-shadow:0 0 4px var(--glow-green-40);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .live{font-size:10px;letter-spacing:.1em;color:var(--red-alert)}

  #log{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:78%;display:flex;flex-direction:column}
  .msg.other{align-self:flex-start;align-items:flex-start}
  .msg.mine{align-self:flex-end;align-items:flex-end}
  .msg .sender{font-size:10px;color:var(--cyan);text-shadow:0 0 4px var(--glow-cyan-40);margin-bottom:2px}
  .msg .bubble{padding:8px;border-radius:2px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg.other .bubble{background:var(--bg-surface-alt);border:1px solid var(--cyan);color:var(--text-white)}
  .msg.mine .bubble{background:var(--bg-btn-green);border:1px solid var(--neon-green);
    color:var(--neon-green);text-shadow:0 0 4px var(--glow-green-25)}
  .msg .meta{font-size:10px;color:var(--text-dim);margin-top:2px}

  form{
    flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;
    background:var(--bg-bar);border-top:1px solid var(--glow-green-40);
  }
  form .caret{color:var(--neon-green);font-size:16px;font-weight:700;
    text-shadow:0 0 6px var(--glow-green-60)}
  input{
    flex:1;height:100%;background:transparent;border:0;outline:0;
    font-family:var(--mono);font-size:13px;color:var(--neon-green);
    text-shadow:0 0 4px var(--glow-green-25);caret-color:var(--neon-green);
  }
  input::placeholder{color:var(--text-dim)}
  button{
    min-width:72px;height:40px;background:var(--bg-btn-green);
    border:1px solid var(--neon-green);border-radius:2px;color:var(--neon-green);
    font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;text-shadow:0 0 6px var(--glow-green-60);cursor:pointer;
  }
  button:active{background:#11411a;border-color:#6bff9e;text-shadow:none}
</style>
</head>
<body>
  <header>
    <span class="dot" id="statusDot"></span>
    <span class="title">amkyaw@chat:~$</span>
    <span class="live" id="live">[LIVE]</span>
  </header>

  <div id="log"></div>

  <form id="composer" autocomplete="off">
    <span class="caret">&gt;</span>
    <input id="input" placeholder="type message..." maxlength="2000" autofocus>
    <button type="submit">[SEND_]</button>
  </form>

<script>
(function () {
  const log    = document.getElementById("log");
  const form   = document.getElementById("composer");
  const input  = document.getElementById("input");
  const live   = document.getElementById("live");
  const dot    = document.getElementById("statusDot");

  // The server injects the handle; fall back to a short random tag.
  const me = window.AMKYAW_USER || ("peer-" + Math.random().toString(36).slice(2, 6));

  let socket = null;
  let retry  = 0;

  function clock() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function append(sender, text, mine) {
    const row = document.createElement("div");
    row.className = "msg " + (mine ? "mine" : "other");
    if (!mine) {
      const s = document.createElement("span");
      s.className = "sender";
      s.textContent = "[" + sender + "]";
      row.appendChild(s);
    }
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(b);
    const m = document.createElement("span");
    m.className = "meta";
    m.textContent = clock();
    row.appendChild(m);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function setConnected(ok) {
    dot.classList.toggle("off", !ok);
    live.textContent = ok ? "[LIVE]" : "[OFFLINE]";
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    // The page is served by the HTTP helper on WS_PORT + 1; the chat socket
    // itself lives on WS_PORT.
    socket = new WebSocket(proto + "//" + location.hostname + ":" + __WS_PORT__ + "/ws");

    socket.onopen = function () { retry = 0; setConnected(true); };
    socket.onclose = function () {
      setConnected(false);
      // Linear backoff, capped, so a dead host is not hammered.
      retry++;
      setTimeout(connect, Math.min(1000 * retry, 10000));
    };
    socket.onerror = function () { setConnected(false); };
    socket.onmessage = function (event) {
      const idx = event.data.indexOf("\t");
      if (idx <= 0) return;
      const sender = event.data.slice(0, idx);
      const text   = event.data.slice(idx + 1);
      append(sender, text, sender === me);
    };
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      append("system", "link down · message not sent", false);
      return;
    }
    socket.send(me + "\t" + text);
    input.value = "";
  });

  connect();
})();
</script>
</body>
</html>
